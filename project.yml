name: MacCheck
options:
  bundleIdPrefix: com.berryxia.maccheck
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      # Universal：同时支持 Apple Silicon 与 Intel Mac（issue #1）
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO

targets:
  MacCheck:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MacCheck 验机宝
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "4"
        NSCameraUsageDescription: 用于摄像头体检项，检查画面是否清晰、有无坏点。
        NSMicrophoneUsageDescription: 用于麦克风体检项，检查录音是否正常。
        NSBluetoothAlwaysUsageDescription: 用于蓝牙体检项，扫描周边设备验证射频是否正常。
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berryxia.maccheck
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/App/MacCheck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/MacCheck-Bridging-Header.h
