name: MacCheck
options:
  bundleIdPrefix: com.berryxia.maccheck
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  MacCheck:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MacCheck 验机宝
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        NSCameraUsageDescription: 用于摄像头体检项，检查画面是否清晰、有无坏点。
        NSMicrophoneUsageDescription: 用于麦克风体检项，检查录音是否正常。
        NSBluetoothAlwaysUsageDescription: 用于蓝牙体检项，扫描周边设备验证射频是否正常。
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berryxia.maccheck
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/App/MacCheck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
